name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Tests and coverage
        run: pytest -q --cov=ventura_data --cov-branch --cov-report=term-missing --cov-fail-under=70
      - name: Build reproducible sample pipeline
        run: ventura-data data/sample/events.csv --warehouse .artifacts/warehouse
      - name: Validate gold output
        run: |
          python - <<'PY'
          import duckdb
          rows = duckdb.connect().execute("SELECT category,event_count,total_value FROM read_parquet('.artifacts/warehouse/gold/category_metrics.parquet') ORDER BY category").fetchall()
          assert rows == [('maintenance', 2, 10.0), ('sensor', 2, 22.5)], rows
          print(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ventura-data-demo-warehouse
          path: .artifacts/warehouse
          if-no-files-found: error
